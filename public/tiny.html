<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Claude Usage</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;background:#101717;border:1px solid #30413d;border-radius:16px;-webkit-app-region:drag;position:relative}
.g{flex:1;text-align:center;min-width:0}
svg{width:100%;height:auto;display:block}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#91a8a3;margin-top:-2px}
.val{font-size:15px;font-weight:650;color:#e4ede9}
.needle{transition:transform .6s ease;transform-origin:60px 60px}
#expand{position:absolute;top:4px;right:6px;width:20px;height:20px;border:0;border-radius:6px;background:#1a2523;color:#91a8a3;font-size:12px;line-height:20px;padding:0;cursor:pointer;opacity:0;transition:opacity .15s;-webkit-app-region:no-drag}
#wrap:hover #expand{opacity:1}
</style></head><body>
<div id="wrap" title="Double-click to open full view">
<button id="expand" title="Full view" hidden>⤢</button>
<div class="g"><svg viewBox="0 0 120 70"><path d="M10 60A50 50 0 0 1 110 60" fill="none" stroke="#344340" stroke-width="9" stroke-linecap="round"/><path id="a5" d="M10 60A50 50 0 0 1 110 60" fill="none" stroke="#5b6b67" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/><g id="n5" class="needle"><line x1="60" y1="60" x2="60" y2="22" stroke="#e4ede9" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="60" cy="60" r="4" fill="#e4ede9"/></svg><div class="lbl">5H</div><div class="val" id="v5">—</div></div>
<div class="g"><svg viewBox="0 0 120 70"><path d="M10 60A50 50 0 0 1 110 60" fill="none" stroke="#344340" stroke-width="9" stroke-linecap="round"/><path id="a7" d="M10 60A50 50 0 0 1 110 60" fill="none" stroke="#5b6b67" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/><g id="n7" class="needle"><line x1="60" y1="60" x2="60" y2="22" stroke="#e4ede9" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="60" cy="60" r="4" fill="#e4ede9"/></svg><div class="lbl">7D</div><div class="val" id="v7">—</div></div>
</div>
<script type="module">
import { gaugeState } from '/gauge.mjs';
const $ = (id) => document.getElementById(id);
function draw(k, q) {
  const g = gaugeState(q);
  $('n' + k).style.transform = `rotate(${g.angle}deg)`;
  $('n' + k).style.opacity = g.valid ? 1 : .35;
  const arc = $('a' + k);
  arc.setAttribute('stroke', g.color);
  arc.setAttribute('stroke-dasharray', `${g.valid ? (g.angle + 90) / 1.8 : 0} 100`);
  $('v' + k).textContent = g.valid ? `${g.left}%${g.stale ? '*' : ''}` : '—';
}
async function update() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) throw Error('status');
    const s = await r.json();
    draw('5', s.quota?.fiveHour); draw('7', s.quota?.sevenDay);
  } catch { draw('5', null); draw('7', null); }
}
update(); setInterval(update, 5000);
if (window.shell) {
  $('expand').hidden = false;
  $('expand').onclick = () => window.shell.setMode('full');
  $('wrap').ondblclick = () => window.shell.setMode('full');
}
</script></body></html>
